name: CI/CD - Deploy no Render

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-render
  cancel-in-progress: false

jobs:
  ci:
    name: CI - Validar Codigo e Compilar
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar o pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Configurar Node.js com cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Instalar dependencias
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        working-directory: backend
        run: pnpm run lint

      - name: Formatacao (Prettier)
        working-directory: backend
        run: pnpm run format:check

      - name: Checagem de tipos (tsc --noEmit)
        working-directory: backend
        run: pnpm run type-check

      - name: Compilar para producao
        working-directory: backend
        run: pnpm run build

  docker-build:
    name: CD - Validar Build da Imagem Docker
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build -t api-service:${{ github.sha }} ./backend

  deploy:
    name: Deploy - Disparar Webhook do Render
    runs-on: ubuntu-latest
    needs: [ci, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Acionar Deploy Hook (curl POST)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Erro: secret RENDER_DEPLOY_HOOK_URL nao configurado."
            exit 1
          fi

          STATUS=$(curl -s -o response.txt -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")

          echo "Status HTTP retornado: $STATUS"
          cat response.txt
          echo ""

          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ]; then
            echo "Falha ao disparar o deploy no Render."
            exit 1
          fi

          echo "Deploy disparado com sucesso."